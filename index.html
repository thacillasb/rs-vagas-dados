<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Painel de Vagas · R&amp;S</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#eef1f7;--cd:#fff;--tx:#18202f;--mu:#6a7488;--bd:#e3e8f1;--pr:#4f46e5;--pr2:#0ea5a4;--ok:#16a34a;--bad:#e11d48;--sh:0 1px 2px #1b24380d,0 6px 20px #1b24380d;--c0:#d97706;--c1:#2563eb;--c2:#7c3aed;--c3:#0d9488;--c4:#16a34a;--c5:#c026d3;--c6:#64748b;--c7:#94a3b8;--hero:linear-gradient(120deg,#1e1b4b,#3730a3 55%,#0e7490);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d111a;--cd:#161c28;--tx:#e9eef7;--mu:#93a0b6;--bd:#263042;--pr:#818cf8;--pr2:#2dd4bf;--ok:#4ade80;--bad:#fb7185;--sh:0 6px 20px #0006;--c0:#fbbf24;--c1:#60a5fa;--c2:#a78bfa;--c3:#2dd4bf;--c4:#4ade80;--c5:#e879f9;--c6:#94a3b8;--c7:#64748b;--hero:linear-gradient(120deg,#151347,#262a7a 55%,#0b4f63);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d111a;--cd:#161c28;--tx:#e9eef7;--mu:#93a0b6;--bd:#263042;--pr:#818cf8;--pr2:#2dd4bf;--ok:#4ade80;--bad:#fb7185;--sh:0 6px 20px #0006;--c0:#fbbf24;--c1:#60a5fa;--c2:#a78bfa;--c3:#2dd4bf;--c4:#4ade80;--c5:#e879f9;--c6:#94a3b8;--c7:#64748b;--hero:linear-gradient(120deg,#151347,#262a7a 55%,#0b4f63);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#1e1b4b;z-index:30}
header{background:var(--hero);color:#fff;padding:22px 20px 56px}
.hi{max-width:1320px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.02em}.sub{opacity:.75;font-size:13px}
.sp{flex:1}.hb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fl{max-width:1320px;margin:16px auto 0;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:#ffffff1f;border-radius:999px;padding:3px;backdrop-filter:blur(6px)}
.seg button{border:0;background:none;color:#fff;padding:7px 15px;border-radius:999px;cursor:pointer;font:inherit;font-weight:600;font-size:13px;opacity:.8}
.seg button.on{background:#fff;color:#2b2a85;opacity:1;box-shadow:0 2px 8px #0003}
.fl small{opacity:.7;font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-right:-6px}
#sv{font-size:12px;opacity:.8}
.btn{border:0;background:#fff;color:#2b2a85;border-radius:10px;padding:9px 14px;cursor:pointer;font:inherit;font-weight:700;font-size:13px;box-shadow:0 2px 10px #0003}
.btn.g{background:#ffffff26;color:#fff;box-shadow:none}.btn.p{background:var(--pr);color:#fff;box-shadow:none}.btn.o{background:none;color:var(--pr);border:1px solid var(--bd);box-shadow:none}
main{max-width:1320px;margin:-38px auto 0;padding:0 16px 40px;position:relative}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:14px}.k.gg{grid-column:span 2}
@media(max-width:900px){.kp{grid-template-columns:repeat(2,1fr)}}
.k,.cd{background:var(--cd);border-radius:16px;padding:14px 16px;box-shadow:var(--sh);border:1px solid var(--bd)}
.k{position:relative;overflow:hidden}.k::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--a,var(--pr))}
.kl{color:var(--mu);font-size:12px;font-weight:600}.kv{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--a,var(--tx))}.ks{color:var(--mu);font-size:12px}
.k.gg{display:flex;align-items:center;gap:14px}
.gauge{--p:0;--gc:var(--ok);width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--gc) calc(var(--p)*1%),var(--bd) 0);display:grid;place-items:center;flex:none}
.gauge span{width:70px;height:70px;border-radius:50%;background:var(--cd);display:grid;place-items:center;font-weight:800;font-size:15px}
.pl{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin-bottom:14px}
.st{background:var(--cd);border:1px solid var(--bd);border-top:4px solid var(--c);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--sh);transition:.15s}
.st:hover{transform:translateY(-2px)}.st.on{outline:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--cd))}
.st b{font-size:24px;display:block;color:var(--c)}.st span{font-size:12px;color:var(--mu);font-weight:600}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-bottom:14px}
.cd h2{font-size:12px;margin:0 0 12px;color:var(--mu);text-transform:uppercase;letter-spacing:.07em}
.r{display:grid;grid-template-columns:minmax(0,1fr) 90px 36px;gap:10px;align-items:center;padding:5px 2px}
.r .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}.r .n small{display:block;color:var(--mu);font-weight:500;font-size:11px}
.r b{text-align:right}.bar{height:8px;border-radius:5px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--b,var(--pr))}
.nv{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}.nv:hover{border-color:var(--pr)}.nv.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 8%,transparent)}
.nv .t{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}.nv .d{display:flex;gap:12px;color:var(--mu);font-size:12px;margin-top:6px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:4px 0 10px;align-items:center;flex-wrap:wrap}
.tabs .t{border:0;background:var(--cd);padding:9px 16px;cursor:pointer;color:var(--mu);font:inherit;font-weight:700;border-radius:999px;border:1px solid var(--bd)}
.tabs .t.on{background:var(--pr);color:#fff;border-color:var(--pr)}.tabs label{color:var(--mu);font-size:13px}
.ow{overflow-x:auto;padding:6px}table{border-collapse:separate;border-spacing:0;width:100%;min-width:980px}
th{font-size:11px;color:var(--mu);text-align:left;padding:8px;text-transform:uppercase;letter-spacing:.06em;position:sticky;top:0;background:var(--cd)}
td{padding:6px 8px;border-top:1px solid var(--bd);vertical-align:middle}tr:hover td{background:color-mix(in srgb,var(--pr) 4%,transparent)}
tr.dp td{background:color-mix(in srgb,var(--pr) 10%,transparent);font-weight:700}
input,select{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;max-width:100%}
input:focus,select:focus{outline:2px solid var(--pr);border-color:transparent}
td input[type=text]{width:100%;min-width:110px}td input[type=number]{width:64px}
select.sx{font-weight:700;border-radius:999px;padding:5px 10px;color:var(--c);border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--cd))}
.tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;color:#fff;background:#0369a1}.tag.JT{background:#c2410c}.tag.G{background:#7c3aed}.tag.B{background:#475569}
.late{color:var(--bad);font-weight:800}.x{border:0;background:none;color:var(--mu);cursor:pointer;font-size:15px}
.pc{font-weight:800}.pc.ok{color:var(--ok)}.pc.bad{color:var(--bad)}
dialog{border:0;border-radius:18px;background:var(--cd);color:var(--tx);width:min(520px,94vw);padding:22px;box-shadow:0 20px 60px #0007}
dialog::backdrop{background:#0b1020aa;backdrop-filter:blur(3px)}h3{margin:0 0 14px;font-size:18px}
.fg{display:grid;gap:10px}.fg label{display:grid;gap:4px;font-size:12px;color:var(--mu);font-weight:600}.fg input,.fg select{width:100%}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.er{color:var(--bad);font-size:12px;min-height:16px;margin-top:6px}.em{color:var(--mu);padding:18px;text-align:center}
.nw{background:color-mix(in srgb,var(--c0) 14%,transparent);border-radius:10px;padding:10px;display:none}.nw p{margin:0 0 8px;font-size:12px}
.cr{display:grid;grid-template-columns:auto 1fr 150px auto;gap:6px;align-items:center}.cb{padding:5px 11px;font-weight:600;max-width:250px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cr input[type=radio]{width:auto;accent-color:var(--pr)}
</style></head><body>
<header><div class="hi"><div><h1>Painel de Vagas · R&amp;S</h1><div class="sub">Mix Maiobão Ubatuba · Mix Jardim Tropical — acompanhamento de quadro e vagas</div></div><span class="sp"></span>
<div class="hb"><span id="sv"></span><button class="btn" onclick="openV()">+ Nova vaga</button><button class="btn g" onclick="openS()">+ Novo setor/cargo</button></div></div>
<div class="fl"><small>Loja</small><div class="seg" id="sg"></div><small>Nível</small><div class="seg" id="sn"></div></div></header>
<main id="app"><div class="cd em">Carregando…</div></main>
<dialog id="dg"></dialog>
<script>
const LS=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const LOCDB={doc:p=>({async get(){const v=LS('loc_'+p);return v?{exists:true,data:()=>JSON.parse(v)}:{exists:false}},async set(o){LS('loc_'+p,JSON.stringify(o))},async delete(){try{localStorage.removeItem('loc_'+p)}catch(e){}}})};
window.claude={use:async n=>{if(n==='db')return LOCDB;if(n==='downloads')return{save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(data);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};return null}};
const ST=['Aberta','Em triagem','Entrevista','Aprovado','Em admissão','Em movimentação','Preenchida','Cancelada'],FIL=['Maiobão Ubatuba','Jardim Tropical'],NIV=['BASE','GESTÃO'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sh=f=>f==='Jardim Tropical'?'JT':'MU',sm=(a,k)=>a.reduce((x,y)=>x+(+y[k]||0),0),today=()=>new Date().toISOString().slice(0,10);
let S={setores:[],vagas:[]},F='Todas',N='Todos',FS=null,tab='v',all=false,ref=null,tmr,NM=new Map();
const ads=L=>{const b=L.filter(s=>!s.semAd&&!/^APRENDIZ$/i.test(String(s.cargo||'').trim())),i=sm(b,'ideal'),r=b.reduce((x,s)=>x+Math.min(+s.real||0,+s.ideal||0),0);return i?r/i:0},adTodas=()=>ads(S.setores),fp=x=>(x*100).toFixed(2).replace('.',',')+'%',guess=c=>/GERENTE/i.test(c)?'GESTÃO':'BASE',kk=(f,d,c)=>f+'|'+d+'|'+c;
const nv=x=>x.nivel||NM.get(kk(x.filial,x.dep,x.cargo))||guess(x.cargo);
const inF=x=>(F==='Todas'||x.filial===F)&&(N==='Todos'||nv(x)===N);
const dias=d=>d?Math.max(0,Math.floor((Date.now()-new Date(d+'T00:00'))/864e5)):0;
const uid=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
function save(){const e=$('#sv');if(!ref){e.textContent='Sem banco de dados';return}e.textContent='Salvando…';clearTimeout(tmr);
 tmr=setTimeout(async()=>{try{await ref.set(S);e.textContent='Salvo ✓'}catch(x){e.textContent='Erro ao salvar: '+(x.message||x)}},500)}
function seg(){$('#sg').innerHTML=['Todas',...FIL].map(f=>`<button class="${F===f?'on':''}" onclick="F='${f}';seg();render()">${f}</button>`).join('');
 $('#sn').innerHTML=['Todos',...NIV].map(f=>`<button class="${N===f?'on':''}" onclick="N='${f}';if(N==='GESTÃO')tab='q';seg();render()">${f==='Todos'?'Todos':f==='BASE'?'Base':'Gestão'}</button>`).join('')}
const act=v=>ST.indexOf(v.status)<6;
function render(){
 NM=new Map(S.setores.map(s=>[kk(s.filial,s.dep,s.cargo),s.nivel]));
 const vg=S.vagas.filter(inF),se=S.setores.filter(inF);
 const ideal=sm(se,'ideal'),real=sm(se,'real'),ad=ads(se);
 const c=ST.map(n=>vg.filter(v=>v.status===n).length),ab=c[0]+c[1]+c[2]+c[3];
 const cr=vg.filter(v=>ST.indexOf(v.status)<4&&dias(v.data)>30).length,pct=Math.round(ad*100);
 const K=(l,v,s,a)=>`<div class="k" style="--a:${a}"><div class="kl">${l}</div><div class="kv">${v}</div><div class="ks">${s}</div></div>`;
 const pl=ST.map((n,i)=>`<div class="st ${FS===n?'on':''}" style="--c:var(--c${i})" onclick="setFS('${n}')"><b>${c[i]}</b><span>${n}</span></div>`).join('');
 const lj=x=>F==='Todas'||x.filial===F,bx=NIV.map(n=>{const s2=S.setores.filter(s=>lj(s)&&nv(s)===n),i=sm(s2,'ideal'),r=sm(s2,'real'),a=ads(s2),v=S.vagas.filter(v=>lj(v)&&nv(v)===n&&act(v)).length;
  return`<div class="nv ${N===n?'on':''}" onclick="N=N==='${n}'?'Todos':'${n}';if(N==='GESTÃO')tab='q';seg();render()"><div class="t"><span>${n==='BASE'?'Base operacional':'Gestão'}</span><span class="pc ${a>=.97?'ok':'bad'}">${fp(a)}</span></div><div class="bar"><i style="width:${a*100}%;--b:${n==='BASE'?'var(--pr)':'var(--c2)'}"></i></div><div class="d"><span>Ideal <b>${i}</b></span><span>Real <b>${r}</b></span><span>Desvio <b class="${r<i?'late':''}">${r-i}</b></span></div></div>`}).join('');
 const g={};vg.filter(act).forEach(v=>g[v.dep]=(g[v.dep]||0)+1);
 const gs=Object.entries(g).sort((a,b)=>b[1]-a[1]).slice(0,7),gm=Math.max(1,...gs.map(x=>x[1]));
 const bys=gs.length?gs.map(([d,n])=>`<div class="r"><span class="n" title="${esc(d)}">${esc(d)}</span><span class="bar"><i style="width:${n/gm*100}%"></i></span><b>${n}</b></div>`).join(''):'<div class="em">Sem vagas em andamento</div>';
 const sv=se.map(s=>({s,g:s.ideal-s.real-vg.filter(v=>v.filial===s.filial&&v.dep===s.dep&&v.cargo===s.cargo&&act(v)).length})).filter(x=>x.g>0).sort((a,b)=>b.g-a.g).slice(0,6);
 const sem=sv.length?sv.map(({s,g})=>`<div class="r" style="grid-template-columns:minmax(0,1fr) auto auto"><span class="n" title="${esc(s.cargo)}">${esc(s.cargo)}<small>${esc(s.dep)} · ${sh(s.filial)}</small></span><b class="late">−${g}</b><button class="btn o" style="padding:4px 9px" onclick="openV('${s.id}')">+ vaga</button></div>`).join(''):'<div class="em">Toda falta de quadro tem vaga aberta ✓</div>';
 const rows=vg.filter(v=>FS?v.status===FS:(all||act(v))).sort((a,b)=>ST.indexOf(a.status)-ST.indexOf(b.status)||dias(b.data)-dias(a.data));
 const vt=rows.length?`<table><tr><th>Loja</th><th>Nível</th><th>Setor</th><th>Cargo</th><th>Status</th><th>Candidatos</th><th>Abertura</th><th>Dias</th><th>Prior.</th><th>Observação</th><th></th></tr>${rows.map(v=>{const i=ST.indexOf(v.status),d=dias(v.data),n=nv(v);return`<tr><td><span class="tag ${sh(v.filial)}">${sh(v.filial)}</span></td><td><span class="tag ${n==='BASE'?'B':'G'}">${n==='BASE'?'BASE':'GESTÃO'}</span></td><td>${esc(v.dep)}</td><td><b>${esc(v.cargo)}</b></td>
 <td><select class="sx" style="--c:var(--c${i})" onchange="upd('${v.id}','status',this.value,1)">${ST.map(s=>`<option ${s===v.status?'selected':''}>${s}</option>`).join('')}</select></td>
 <td>${cs(v)}</td>
 <td><input type="date" value="${esc(v.data)}" onchange="upd('${v.id}','data',this.value,1)"></td><td class="${i<4&&d>30?'late':''}">${d}</td>
 <td><select onchange="upd('${v.id}','prio',this.value)">${['Alta','Média','Baixa'].map(p=>`<option ${p===v.prio?'selected':''}>${p}</option>`).join('')}</select></td>
 <td><input type="text" value="${esc(v.obs)}" onchange="upd('${v.id}','obs',this.value)"></td><td><button class="x" title="Excluir" onclick="del('${v.id}',this)">✕</button></td></tr>`}).join('')}</table>`:'<div class="em">Nenhuma vaga neste filtro — o quadro está completo. Veja a aderência na aba “Quadro por setor”.</div>';
 let qt='<table><tr><th>Loja</th><th>Setor</th><th>Cargo</th><th>Nível</th><th>Ideal</th><th>Real</th><th>Desvio</th><th>Aderência</th><th title="Desmarque para tirar o cargo do cálculo da aderência (ex.: Aprendiz)">Conta</th><th>PCDs</th><th>Vagas ativas</th><th></th></tr>';
 FIL.filter(f=>F==='Todas'||F===f).forEach(f=>{[...new Set(se.filter(s=>s.filial===f).map(s=>s.dep))].forEach(d=>{const L=se.filter(s=>s.filial===f&&s.dep===d),I=sm(L,'ideal'),R=sm(L,'real'),a=ads(L);
 qt+=`<tr class="dp"><td><span class="tag ${sh(f)}">${sh(f)}</span></td><td colspan="3">${esc(d)}</td><td>${I}</td><td>${R}</td><td>${R-I}</td><td class="pc ${a>=1?'ok':'bad'}">${(a*100).toFixed(0)}%</td><td></td><td>${sm(L,'pcd')}</td><td>${vg.filter(v=>v.filial===f&&v.dep===d&&act(v)).length}</td><td></td></tr>`;
